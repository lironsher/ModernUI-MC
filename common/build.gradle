plugins {
    id 'agency.highlysuspect.minivan' version '0.5'
}

repositories {
    // Route the entire org.lwjgl group exclusively to Mojang's library repo.
    // Minecraft 1.21.11 pulls LWJGL natives whose classifier variants
    // (notably org.lwjgl:lwjgl-freetype:3.3.3:natives-macos-patch) are published
    // ONLY at libraries.minecraft.net, not Maven Central. If Gradle resolves the
    // lwjgl module POM from Central first, it then 404s on the macos-patch
    // classifier and never falls back to Mojang. Making Mojang exclusive for
    // org.lwjgl guarantees the POM and every classifier come from the one repo
    // that has them all.
    exclusiveContent {
        forRepository {
            maven {
                name 'Mojang'
                url 'https://libraries.minecraft.net/'
            }
        }
        filter {
            includeGroup 'org.lwjgl'
        }
    }
    maven {
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url 'https://maven.izzel.io/releases/'
    }
    mavenLocal()
}

minivan {
    version(minecraft_version)
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.8'

    implementation("dev.icyllis:modernui-core:${core_version}")
    implementation("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        transitive = false
    }
}
