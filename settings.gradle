pluginManagement {
    repositories {
        maven {
            url 'https://maven.minecraftforge.net/'
        }
        maven {
            url 'https://maven.neoforged.net/releases/'
        }
        maven {
            url 'https://maven.fabricmc.net/'
        }
        maven {
            url 'https://maven.architectury.dev/'
        }
        maven {
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            url 'https://repo.sleeping.town/'
            content {
                includeGroup 'agency.highlysuspect'
                includeGroup 'agency.highlysuspect.minivan'
            }
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'ModernUI-MC'

include 'common'

// Forge and NeoForge are excluded on the MC 1.21.11 branch: this branch targets
// Fabric only (for Poofy), and neither Forge nor NeoForge has published a
// 1.21.11 toolchain (e.g. net.minecraftforge:forge:1.21.11-* does not exist),
// so configuring those subprojects fails the whole build. Re-enable them if/when
// a 1.21.11 Forge/NeoForge toolchain ships.
//include 'forge'
//project(':forge').name = "ModernUI-Forge"
//include 'neoforge'
//project(':neoforge').name = "ModernUI-NeoForge"
include 'fabric'
project(':fabric').name = "ModernUI-Fabric"
